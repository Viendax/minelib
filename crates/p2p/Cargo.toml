[package]
name = "minelib-p2p"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Minelib : relais joignable sans port ouvert (iroh) et rendez-vous dans le DHT de BitTorrent (mainline)"

[dependencies]
anyhow = "1"
iroh = "1.4.1"
mainline = "8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
sha2 = "0.10"
log = "0.4"
