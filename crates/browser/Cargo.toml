[package]
name = "minelib-browser"
version = "0.1.0"
edition = "2021"
publish = false
description = "Navigateur Chromium (CEF) hors écran pour les écrans vidéo de Minelib"

[[bin]]
name = "minelib-browser"
path = "src/main.rs"

[dependencies]
# Chromium Embedded Framework (bindings Rust de tauri-apps). Sans bac à sable : il demande
# une bibliothèque statique propre à MSVC.
cef = { version = "150", default-features = false }

# (v213) Volume des écrans : celui des sons du navigateur dans Windows (sessions audio).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
codegen-units = 16

# Hors du workspace du jeu (voir `exclude` dans le Cargo.toml racine) : le jeu ne dépend
# jamais de CEF, ses builds et sa CI restent inchangés.
[workspace]
