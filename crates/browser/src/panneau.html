<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Playlist</title>
<!--
  (v289) Le volet des écrans : une page à part (son propre onglet du navigateur), que le jeu
  colle sur la gauche de n'importe quelle page de l'écran. Demande du propriétaire : il
  s'ouvre depuis le bord gauche, sur toutes les pages (pas seulement pendant une vidéo).

  En haut, les boutons qui étaient dans le coin de l'écran : Google, (v291) Twitch, retour,
  suivant (pas YouTube : il a son bouton de recherche plus bas). Puis « Chercher une vidéo
  sur » YouTube, Dailymotion, Vimeo (la recherche à côté, ✕ pour la fermer), puis la playlist
  (en ligne).

  (v291) La playlist entière : les vidéos déjà vues (au-dessus : on remonte pour les voir),
  celle en cours, celles à suivre. Un clic sur une vidéo la lance ; ▲ ▼ la montent ou la
  descendent d'un rang (vues comprises) ; × la retire. Partir sur un autre site met celle en
  cours en pause : un clic sur elle la reprend là où elle en était. (v300) Un clic sur celle
  en cours la met en pause, un autre la reprend. (v302) Finie, un clic la relance ; × sur
  celle en cours (s'il y a une suivante) la retire et lance la suivante.

  Le jeu lui dit tout par `__mlb.etat({f, c, p, e, i, h, r, l})` : la playlist (numéros), le
  rang de celle en cours, si elle est en pause, (v302) finie, si la page de l'écran la montre, les pages où
  aller (1 retour, 2 suivant), le site de la recherche ouverte, en ligne ou non. Elle répond
  par des ordres : `{"nav":"google"|"twitch"|"retour"|"suivant"}`,
  `{"recherche":"yt"|"dm"|"vm"|false}`,
  `{"joue"|"monte"|"descend"|"retire"|"bascule":rang,"v":numéro}`.
-->
<style>
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#0f0f0f;color:#f1f1f1;overflow:hidden;
  font:15px system-ui,"Segoe UI",Roboto,Arial,sans-serif}
body{box-sizing:border-box;padding:16px 14px;border-right:1px solid #272727;
  display:flex;flex-direction:column}
.rang{display:flex;gap:6px;margin:0 0 14px;flex:none}
.rang button{flex:1;min-width:0;padding:9px 2px;border:1px solid #3f3f3f;border-radius:18px;
  background:#121212;color:#f1f1f1;font:inherit;font-size:13px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rang button:disabled{opacity:.35;cursor:default}
.rang button.actif{background:#f1f1f1;color:#0f0f0f;border-color:#f1f1f1;font-weight:600}
#nav .fl{flex:none;width:40px;padding:9px 0;font-size:16px}
#twitch{color:#bf94ff}
#ferme{flex:none!important;width:36px;padding:9px 0!important;display:none}
body.cote #ferme{display:block}
.titre{margin:0 4px 8px;font-size:13px;color:#aaa;flex:none}
h2{font-size:18px;margin:4px 4px 12px;flex:none}
#partie{flex:1;min-height:0;display:flex;flex-direction:column}
#liste{flex:1;min-height:0;overflow-y:auto;position:relative}
.v{display:flex;gap:8px;align-items:center;margin:0 0 8px;padding:4px;border-radius:10px;
  cursor:pointer}
.v:hover{background:#1e1e1e}
.v.lu{opacity:.55}
.v.cours{background:#263238;cursor:default}
.v.cours.reprendre{cursor:pointer}
.v.cours.reprendre:hover{background:#2f3d44}
.v.cours.pause .t .et{color:#fdd663}
.v .im{position:relative;flex:none;width:96px;height:54px}
.v .img{width:96px;height:54px;object-fit:cover;border-radius:8px;background:#272727;display:block}
.v .n{position:absolute;left:4px;top:3px;font-size:12px;background:rgba(0,0,0,.75);
  border-radius:4px;padding:0 5px}
.v .s{position:absolute;left:4px;bottom:3px;font-size:11px;background:rgba(0,0,0,.75);
  border-radius:4px;padding:0 5px;color:#ddd}
.v .t{flex:1;min-width:0;font-size:13px;line-height:1.3}
.v .t .nom{max-height:3.9em;overflow:hidden}
.v .t .et{font-size:11px;color:#8ab4f8;margin-top:2px}
.v.lu .t .et{color:#aaa}
.v .fl{flex:none;display:flex;flex-direction:column;gap:2px}
.v .fl button,.v .x{width:26px;height:24px;border-radius:6px;border:0;background:#272727;
  color:#f1f1f1;font-size:11px;cursor:pointer;padding:0}
.v .fl button:disabled{opacity:.25;cursor:default}
.v .x{flex:none;height:26px;border-radius:50%;font-size:16px}
.v.cours .x{visibility:hidden}
.v.cours.saute .x{visibility:visible}
#vide,#solo{color:#aaa;font-size:14px;line-height:1.4;margin:4px}
</style>
</head>
<body>
<div class="rang" id="nav"><button id="google">🔍 Google</button><button
id="twitch">Twitch</button><button id="retour" class="fl" title="Page précédente"
disabled>←</button><button id="suivant" class="fl" title="Page suivante" disabled>→</button></div>
<div class="titre">Chercher une vidéo sur</div>
<div class="rang" id="sites"><button data-s="yt">YouTube</button><button
data-s="dm">Dailymotion</button><button data-s="vm">Vimeo</button><button id="ferme"
title="Fermer la recherche">✕</button></div>
<div id="partie"><h2>Playlist</h2><div id="liste"></div></div>
<div id="solo" hidden>La playlist est pour les parties en ligne. En solo, une vidéo
cliquée dans la recherche s'ouvre sur l'écran.</div>
<script>
(()=>{
window.__mlb_volet=1;
const dit=s=>{try{window.chrome.webview.postMessage(s);}catch(_){console.log(s);}};
const ordre=o=>dit('__minelib_ordre__'+JSON.stringify(o));
const ok=s=>/^[A-Za-z0-9_-]{11}$/.test(s||'')||/^vm:\d{1,12}$/.test(s||'')
  ||/^dm:[A-Za-z0-9]{5,12}$/.test(s||'');
const site=v=>v.startsWith('vm:')?'vm':v.startsWith('dm:')?'dm':'yt';
const NOMS={yt:'YouTube',dm:'Dailymotion',vm:'Vimeo'};
const $=id=>document.getElementById(id);
$('google').addEventListener('click',()=>ordre({nav:'google'}));
$('twitch').addEventListener('click',()=>ordre({nav:'twitch'}));
$('retour').addEventListener('click',()=>ordre({nav:'retour'}));
$('suivant').addEventListener('click',()=>ordre({nav:'suivant'}));
document.querySelectorAll('#sites button[data-s]').forEach(b=>b.addEventListener('click',
  ()=>ordre({recherche:b.dataset.s})));
$('ferme').addEventListener('click',()=>ordre({recherche:false}));
// La playlist : titres et images chargés une fois par vidéo.
let liste=[],cour=-1,vu='',courId=null,recale=true,pause=false,ici=true,finie=false;const infos={};
const info=v=>{if(infos[v]||!ok(v))return;const o=infos[v]={titre:'',image:''};const S=site(v);
  const fin=()=>montre();
  if(S==='yt'){o.image='https://i.ytimg.com/vi/'+v+'/mqdefault.jpg';
    fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+v))
    .then(r=>r.ok?r.json():null).then(j=>{if(j&&j.title){o.titre=j.title;fin();}}).catch(()=>{});}
  else if(S==='vm'){
    fetch('https://vimeo.com/api/oembed.json?url='+encodeURIComponent('https://vimeo.com/'+v.slice(3)))
    .then(r=>r.ok?r.json():null).then(j=>{if(j){o.titre=j.title||'';o.image=j.thumbnail_url||'';fin();}}).catch(()=>{});}
  else{fetch('https://api.dailymotion.com/video/'+v.slice(3)+'?fields=title,thumbnail_360_url')
    .then(r=>r.ok?r.json():null).then(j=>{if(j){o.titre=j.title||'';o.image=j.thumbnail_360_url||'';fin();}}).catch(()=>{});}};
const bouton=(cl,txt,titre,f)=>{const b=document.createElement('button');if(cl)b.className=cl;
  b.textContent=txt;b.title=titre;b.addEventListener('click',e=>{e.stopPropagation();f();});return b;};
const montre=()=>{const l=$('liste');const haut=l.scrollTop;l.textContent='';
  liste.forEach((v,i)=>{info(v);const o=infos[v]||{titre:'',image:''};
    const d=document.createElement('div');
    const rep=i===cour;
    d.className='v'+(i<cour?' lu':i===cour?' cours':'')+(i===cour&&(pause||finie)?' pause':'')+(rep?' reprendre':'')
      +(i===cour&&cour<liste.length-1?' saute':'');
    const im=document.createElement('div');im.className='im';
    const img=document.createElement(o.image?'img':'div');img.className='img';
    if(o.image){img.src=o.image;img.alt='';}im.append(img);
    if(i>cour){const n=document.createElement('span');n.className='n';n.textContent=String(i-cour);im.append(n);}
    if(v&&site(v)!=='yt'){const b=document.createElement('span');b.className='s';b.textContent=NOMS[site(v)];im.append(b);}
    const t=document.createElement('div');t.className='t';
    const nom=document.createElement('div');nom.className='nom';nom.textContent=o.titre||'…';t.append(nom);
    if(i<=cour){const et=document.createElement('div');et.className='et';
      et.textContent=i<cour?'Déjà vue':finie?'↻ Terminée : clique pour la revoir'
        :pause?'⏸ En pause : clique pour reprendre'
        :ici?'▶ En cours : clique pour mettre en pause':'▶ En cours : clique pour y revenir';t.append(et);}
    const fl=document.createElement('div');fl.className='fl';
    const h=bouton('','▲','Monter',()=>ordre({monte:i,v:v}));h.disabled=i===0;
    const b=bouton('','▼','Descendre',()=>ordre({descend:i,v:v}));b.disabled=i===liste.length-1;
    fl.append(h,b);
    const x=bouton('x','×',i===cour?'Retirer et passer à la suivante':'Retirer',()=>ordre({retire:i,v:v}));
    d.append(im,t,fl,x);
    if(i!==cour)d.addEventListener('click',()=>ordre({joue:i,v:v}));
    else d.addEventListener('click',()=>ordre({bascule:i,v:v}));
    l.append(d);});
  const vide=document.createElement('div');vide.id='vide';
  vide.textContent='Rien à suivre. Cherche une vidéo et clique dessus : elle se mettra ici.';
  vide.hidden=cour>=0&&cour<liste.length-1;l.append(vide);
  // De quoi mettre celle en cours en haut, les vues au-dessus (on remonte pour les voir).
  const fin=document.createElement('div');l.append(fin);
  const c=l.querySelector('.v.cours');
  if(c)fin.style.height=Math.max(0,l.clientHeight-(fin.offsetTop-c.offsetTop))+'px';
  if(recale){l.scrollTop=c?c.offsetTop:0;recale=false;}else l.scrollTop=haut;};
montre();
window.__mlb={
  etat:e=>{if(!e||typeof e!=='object')return;
    const f=Array.isArray(e.f)?e.f.slice(0,61).map(v=>ok(v)?v:''):[];
    const c=Number.isInteger(e.c)&&e.c>=0&&e.c<f.length?e.c:-1;
    const p=e.p===true,a=e.i!==false,fe=e.e===true;
    const cle=c+'|'+p+'|'+a+'|'+fe+'|'+f.join(',');
    if(cle!==vu){vu=cle;liste=f;cour=c;pause=p;ici=a;finie=fe;const id=c>=0?f[c]:null;
      if(id!==courId){courId=id;recale=true;}montre();}
    const h=e.h|0;
    $('retour').disabled=!(h&1);
    $('suivant').disabled=!(h&2);
    const r=NOMS[e.r]?e.r:'';
    document.body.classList.toggle('cote',!!r);
    document.querySelectorAll('#sites button[data-s]').forEach(b=>b.classList.toggle('actif',b.dataset.s===r));
    const l=e.l!==false;
    $('partie').hidden=!l;
    $('solo').hidden=l;},
};
})();
</script>
</body>
</html>
