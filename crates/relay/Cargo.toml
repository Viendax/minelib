[package]
name = "minelib-relay"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "minelib-relay"
path = "src/main.rs"

[dependencies]
minelib-p2p = { path = "../p2p" }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
minelib-net = { path = "../net" }
rand = "0.8"
argon2 = "0.5"
sha2 = "0.10"
ed25519-dalek = "2"
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
