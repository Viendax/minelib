[package]
name = "minelib"
version.workspace = true
edition.workspace = true

[dependencies]
sha2 = "0.10"
minelib-p2p = { path = "../p2p" }
ureq = "3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow.workspace = true
env_logger.workspace = true
log.workspace = true
glam.workspace = true
winit.workspace = true
flate2 = "1"
image.workspace = true
# Presse-papier (image de la dernière capture d'écran).
# Sons (tir, rechargement, lunette) : sortie audio et décodage Ogg Vorbis.
cpal = "0.15"
rodio = { version = "0.19", default-features = false, features = ["vorbis"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
minelib-platform = { path = "../platform" }
minelib-render = { path = "../render" }
minelib-world = { path = "../world" }
minelib-assets = { path = "../assets" }
minelib-net = { path = "../net" }
minelib-relay = { path = "../relay" }
# QR code de la double authentification (MIT / Apache-2.0).
qrcode = { version = "0.14", default-features = false }
