# Publication automatique : à chaque envoi sur GitHub, si le numéro de version du jeu
# (`VERSION` dans crates/app/src/update.rs) n'a pas encore de Release, GitHub compile le
# jeu pour Windows et publie la Release `vNN` avec l'exécutable. Les jeux installés la
# voient et se mettent à jour tout seuls.
name: Release

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      # Récupération du code sans module extérieur (même `actions/checkout` peut être
      # refusé par les réglages du dépôt, ce qui empêche le travail de démarrer).
      - name: Code
        shell: bash
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Numéro de version
        id: v
        shell: bash
        run: |
          n=$(grep -oE 'pub const VERSION: u32 = [0-9]+' crates/app/src/update.rs | grep -oE '[0-9]+$')
          echo "n=$n" >> "$GITHUB_OUTPUT"
          if gh release view "v$n" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=1" >> "$GITHUB_OUTPUT"
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # Rust est déjà installé sur les machines de GitHub (pas de module extérieur, que
      # les réglages du dépôt peuvent refuser).
      - name: Rust
        if: steps.v.outputs.exists == '0'
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # Mémoire de compilation (outil fourni par GitHub) : les bibliothèques déjà compilées
      # sont reprises de la fois précédente, seul le code du jeu est recompilé (~3 min au
      # lieu de ~11). Clé : Cargo.lock (bibliothèques et leurs versions) ; s'il change, on
      # repart de la mémoire la plus proche.
      - name: Mémoire de compilation
        if: steps.v.outputs.exists == '0'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-windows-

      - name: Compilation
        if: steps.v.outputs.exists == '0'
        run: cargo build --release -p minelib -p minelib-relay -p minelib-launcher

      - name: Publication
        if: steps.v.outputs.exists == '0'
        shell: bash
        run: |
          n=${{ steps.v.outputs.n }}
          cp target/release/minelib.exe "minelib_v$n.exe"
          cp target/release/minelib-relay.exe "minelib-relay_v$n.exe"
          # Le lanceur garde toujours le même nom : le lien « dernière version » ne change
          # jamais (releases/latest/download/minelib-launcher.exe).
          cp target/release/minelib-launcher.exe "minelib-launcher.exe"
          # Empreintes SHA-256 : le jeu vérifie ce qu'il télécharge, et se compare à la
          # version officielle.
          sha256sum "minelib_v$n.exe" | cut -d' ' -f1 > "minelib_v$n.exe.sha256"
          sha256sum "minelib-relay_v$n.exe" | cut -d' ' -f1 > "minelib-relay_v$n.exe.sha256"
          gh release create "v$n" "minelib-launcher.exe" "minelib_v$n.exe" "minelib-relay_v$n.exe" \
            "minelib_v$n.exe.sha256" "minelib-relay_v$n.exe.sha256" \
            --repo "${{ github.repository }}" \
            --title "Minelib v$n" --notes "Version $n (publiée automatiquement)." --latest
        env:
          GH_TOKEN: ${{ github.token }}
