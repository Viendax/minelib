# Minelib (v334) : un serveur TURN à soi (coturn), en secours du service gratuit.
# Voir LISEZMOI.md. Le secret est écrit par installer.sh ; ne jamais le publier.

# UDP et TCP sur le même port (le jeu essaie UDP, puis TCP).
listening-port=3478
realm=minelib
fingerprint

# Identifiants qui expirent, calculés par le Worker avec ce secret (« COTURN_SECRET »).
use-auth-secret
static-auth-secret=A_REMPLACER

# Si la machine est derrière un NAT (adresse privée sur sa carte réseau) :
#external-ip=<adresse publique>/<adresse privée>

# Ports des adresses relayées (à ouvrir en UDP dans le pare-feu).
min-port=49152
max-port=65535

# Rien d'autre que TURN : pas de TLS, pas de console, pas d'allocation TCP vers les pairs.
no-tls
no-dtls
no-cli
no-tcp-relay
no-multicast-peers

# Personne ne relaie vers la machine elle-même ni vers un réseau privé.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Limites. Un joueur de partie FPS par TURN (128 mises à jour par seconde) : ~45 Ko/s
# reçus et ~20 Ko/s envoyés ; l'hôte envoie autant à chacun de ses joueurs, par une seule
# allocation. En construction en ligne, bien moins.
# Allocations à la fois (deux par joueur au plus : son jeu et son relais).
total-quota=400
user-quota=0
# Débit d'une allocation (octets par seconde) : 1 000 000 = un hôte et 20 joueurs.
max-bps=1000000
# Débit que le serveur s'accorde en tout (octets par seconde) : 12 500 000 = 100 Mbit/s.
# À régler sur ce que la machine a le droit d'envoyer.
bps-capacity=12500000

simple-log
log-file=syslog
