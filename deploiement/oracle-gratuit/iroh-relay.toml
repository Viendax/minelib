# Serveur relais d'iroh de Minelib (v327) : `iroh-relay --config-path iroh-relay.toml`.
# Logiciel libre de l'équipe d'iroh (cargo install iroh-relay --version 1.4.1 --features server).

# Relayer les connexions (c'est son rôle).
enable_relay = true
# Port HTTP (portail captif, et défi de Let's Encrypt avant le premier certificat).
http_bind_addr = "[::]:80"
# Adresses vues de l'extérieur, par QUIC (UDP 7842) : il faut TLS.
enable_quic_addr_discovery = true
enable_metrics = false

[tls]
https_bind_addr = "[::]:443"
quic_bind_addr = "[::]:7842"
cert_mode = "LetsEncrypt"
# Le nom de cette machine (DuckDNS, gratuit : voir LISEZMOI.md). Il doit pointer sur son
# adresse IP publique avant le premier lancement.
hostname = "minelib-relais1.duckdns.org"
contact = "ton-adresse@exemple.fr"
cert_dir = "/var/lib/minelib/iroh-relay"
prod_tls = true

# Personne ne prend tout : au plus 2 Mo/s envoyés par un même jeu, 4 Mo d'un coup.
[limits.client.rx]
bytes_per_second = 2000000
max_burst_bytes = 4000000
