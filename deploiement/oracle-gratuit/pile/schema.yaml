# Minelib (v329) : formulaire de la pile dans Resource Manager.
title: "Minelib : relais officiel, passeurs et serveurs relais d'iroh (offre gratuite)"
description: "Crée le réseau, son pare-feu, un seau et jusqu'à quatre machines Always Free. Elles construisent et lancent Minelib toutes seules (environ 45 minutes)."
schemaVersion: 1.1.0
version: "20190304"
locale: "en"

variableGroups:
  - title: "Oracle"
    visible: false
    variables:
      - ${tenancy_ocid}
      - ${compartment_ocid}
      - ${region}
  - title: "Minelib"
    variables:
      - ${nom}
      - ${duckdns_noms}
      - ${duckdns_jeton}
      - ${contact}
      - ${cle_ssh}
      - ${machines_arm}
      - ${machines_amd}

variables:
  nom:
    type: string
    title: "Nom du relais officiel"
    default: "Minelib"
    required: true
    pattern: "^[^'\"]{1,40}$"
  duckdns_noms:
    type: string
    title: "Noms DuckDNS (facultatif)"
    description: "Deux noms créés sur duckdns.org, sans .duckdns.org, séparés par une virgule (un par machine Arm). Ils donnent nos serveurs relais d'iroh. Vide : sans eux."
    required: false
  duckdns_jeton:
    type: password
    title: "Jeton DuckDNS (facultatif)"
    description: "Le « token » affiché sur duckdns.org une fois connecté."
    required: false
  contact:
    type: string
    title: "Adresse e-mail pour Let's Encrypt (facultatif)"
    required: false
  cle_ssh:
    type: oci:core:ssh:publickey
    title: "Clé SSH publique (facultatif)"
    description: "Pour se connecter aux machines. Vide : la pile en crée une (sortie cle_ssh_privee)."
    required: false
  machines_arm:
    type: integer
    title: "Machines Arm (A1 : 1 processeur, 6 Go)"
    minimum: 1
    maximum: 2
    default: 2
    required: true
  machines_amd:
    type: integer
    title: "Petites machines AMD (E2.1.Micro), passeurs seulement"
    minimum: 0
    maximum: 2
    default: 2
    required: true

outputs:
  ligne_relais_officiel:
    type: link
    title: "Ligne du relais officiel (pour relais_officiels.txt)"
    displayText: "Ligne du relais officiel"
  etat_relais:
    type: link
    title: "État de la première machine"
    displayText: "État de la construction"
  relais_iroh:
    type: copyableString
    title: "Pour relais_iroh.txt"
  adresses_ip:
    type: list
    title: "Adresses IP des machines"
  cle_ssh_privee:
    type: copyableString
    title: "Clé SSH privée (si la pile l'a créée)"

primaryOutputButton: ${etat_relais}
